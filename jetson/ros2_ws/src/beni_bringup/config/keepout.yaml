# §11.10 learned keepout zones: loaded only when /maps/keepout.yaml exists (written by the agent's nightly job).
global_costmap:
  global_costmap:
    ros__parameters:
      filters: [keepout_filter]
      keepout_filter:
        plugin: nav2_costmap_2d::KeepoutFilter
        enabled: true
        filter_info_topic: /costmap_filter_info

costmap_filter_info_server:
  ros__parameters:
    type: 0
    filter_info_topic: /costmap_filter_info
    mask_topic: /keepout_filter_mask
    base: 0.0
    multiplier: 1.0

filter_mask_server:
  ros__parameters:
    frame_id: map
    topic_name: /keepout_filter_mask
    yaml_filename: /maps/keepout.yaml

lifecycle_manager_filters:
  ros__parameters:
    autostart: true
    bond_timeout: 8.0
    node_names: [filter_mask_server, costmap_filter_info_server]
