; ESP32 base controller (§7.5). ESP-IDF 5.3 via PlatformIO: pio run -t upload && pio device monitor
; Pinned platform = pinned IDF (6.9.0 -> ESP-IDF v5.3.1), so pulse_cnt / i2c_master / adc_oneshot APIs match.
[platformio]
src_dir = main  ; ESP-IDF only picks up main/ (or components/) as the app component: keeps idf.py and pio in step

[env:base]
platform = espressif32@6.9.0
board = esp32dev
framework = espidf
board_build.f_cpu = 240000000L
monitor_speed = 115200
upload_speed = 921600
build_type = release
